name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0-test
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Sync Capacitor
        run: npm run cap:sync

      - name: Build debug APK
        run: npm run android:assemble-debug

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk driftone-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: driftone-debug-apk
          path: driftone-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Driftone ${{ github.event.inputs.tag || github.ref_name }}
          files: driftone-debug.apk
          generate_release_notes: true
          prerelease: true
